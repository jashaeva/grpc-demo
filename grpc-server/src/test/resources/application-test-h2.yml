# application-test.yaml
spring:
  testcontainers:
    enabled: false

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  flyway:
    enabled: true
    locations: classpath:db/migration/h2  # Миграции для H2

  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: none

  kafka:
    bootstrap-servers: localhost:9092  # Можно использовать embedded Kafka или мок
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

grpc:
  server:
    in-process-name: test-server
    port: -1
  client:
    test-server:
      address: in-process:test-server
      negotiation-type: PLAINTEXT
      security:
        enabled: false

logging:
  level:
    root: INFO
    omsu: INFO