plugins {
    id 'java'
    id 'com.google.protobuf' version '0.9.5'
}

group = 'omsu'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation("io.grpc:grpc-protobuf:${grpcVersion}") {
        exclude group: 'com.google.protobuf'
    }
    implementation("io.grpc:grpc-stub:${grpcVersion}") {
        exclude group: 'com.google.protobuf'
    }
    implementation 'build.buf.protoc-gen-validate:pgv-java-stub:1.3.3'
    testImplementation 'build.buf.protoc-gen-validate:protoc-gen-validate:1.3.3'
    protobuf "build.buf.protoc-gen-validate:protoc-gen-validate:1.3.3"

    implementation "net.datafaker:datafaker:${fakerVersion}"
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    clean {
        delete generatedFilesBaseDir
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
        validate {
            artifact = "build.buf.protoc-gen-validate:protoc-gen-validate:1.3.3"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {
//                может быть неправильно - проверить на всех тестах
                outputSubDir = 'java'
            }
            validate {  option 'lang=java'}
        }

        all().each { task ->
            task.generateDescriptorSet = true
            task.descriptorSetOptions.includeImports = true
            task.descriptorSetOptions.path = "$projectDir/src/test/resources/grpc/services.dsc"
        }
    }
}

processTestResources.dependsOn generateProto
processTestResources.dependsOn generateTestProto
