plugins {
    id 'project-report'
    id 'org.springframework.boot' version "${springBootVersion}"
}

group = 'omsu'
version = '1.0-SNAPSHOT'

dependencies {
    implementation project(':grpc-common')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation "org.springframework.kafka:spring-kafka"

    // Правильная gRPC клиентская библиотека (как у сервера)
    implementation("net.devh:grpc-client-spring-boot-starter:${springGrpcVersion}") {
        exclude group: 'io.grpc'
        exclude group: 'com.google.protobuf'
    }
    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-inprocess:${grpcVersion}"
    implementation "com.google.protobuf:protobuf-java-util:${protobufVersion}"
    implementation "javax.annotation:javax.annotation-api:${javaxVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "org.wiremock:wiremock-grpc-extension-jetty12:${wiremockGrpcVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation "io.rest-assured:rest-assured:${restAssuredVersion}"
    testImplementation "org.awaitility:awaitility:${awaitilityVersion}"

    // Testcontainers
    testImplementation(platform("org.testcontainers:testcontainers-bom:2.0.4"))
    testImplementation("org.testcontainers:postgresql")
    testImplementation("org.testcontainers:testcontainers")
    testImplementation("org.testcontainers:junit-jupiter")
    testImplementation("org.testcontainers:kafka")
}

tasks.test {
    dependsOn ':grpc-server:jibDockerBuild'
    useJUnitPlatform()
}

tasks.register('printVersion') {
    doLast {
        println project.version
    }
}