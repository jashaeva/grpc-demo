plugins {
    id 'org.springframework.boot' version "${springBootVersion}"
}

group = 'omsu'
version = '1.0-SNAPSHOT'


dependencies {
    implementation project(':grpc-common')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation 'org.springframework.grpc:spring-grpc-spring-boot-starter:0.2.0'

    implementation platform("com.fasterxml.jackson:jackson-bom:${jacksonVersion}")
    implementation "javax.annotation:javax.annotation-api:${javaxVersion}"

    implementation "io.grpc:grpc-bom:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "io.grpc:grpc-okhttp:${grpcVersion}"
    // To fix weird logs
    implementation "io.grpc:grpc-census:${grpcVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "org.wiremock:wiremock-grpc-extension-jetty12:${wiremockGrpcVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.register('printVersion') {
    doLast {
        println project.version
    }
}
